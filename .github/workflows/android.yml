
name: Build D.A Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(find . -type f -name settings.gradle -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Find generated APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print
          find . -type f -name "*.apk" | grep -q . || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DA-Arrears-Calculator-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
